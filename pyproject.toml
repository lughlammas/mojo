[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mojo-dreamfabrics"
version = "0.1.0"
description = "MOJO (Dream Fabrics) — motor semântico de mundos interativos .mjo (protótipo v0.1, não pronto para produção)"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.18"]
readme = "README.md"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mojo = "mojo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mojo.world" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["ragnarok: exige o Ragnarok real rodando em 127.0.0.1:8765 (pulado se ausente)"]
